<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ToolHub by Nexus</title>
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

    <div class="logo">
      <span class="logo-icon">🔧</span>
      <div>

      <button class="cat-btn" data-category="power">Power</button>
      <button class="cat-btn" data-category="industrial">Industrial</button>

  <footer>
    <p>ToolHub by Nexus Equipment Group</p>
    <a href="https://wa.me/27642448154" class="whatsapp-btn">Chat on WhatsApp</a>
